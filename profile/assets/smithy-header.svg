<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">The Kirion Smithy</title>
  <desc id="desc">A restrained ancient-engineering banner for The Kirion Smithy.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090A0F"/>
      <stop offset="55%" stop-color="#111018"/>
      <stop offset="100%" stop-color="#07080C"/>
    </linearGradient>
    <linearGradient id="silver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F1EFEA"/>
      <stop offset="48%" stop-color="#C9C4BE"/>
      <stop offset="100%" stop-color="#7F7A80"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6D3CFF"/>
      <stop offset="50%" stop-color="#B57BFF"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <pattern id="engrave" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M42 0H0V42" fill="none" stroke="#B57BFF" stroke-opacity=".035"/>
      <circle cx="21" cy="21" r="1.2" fill="#D8D4D1" opacity=".05"/>
    </pattern>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="330" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="24" fill="url(#engrave)"/>

  <!-- left seal -->
  <g transform="translate(175 165)">
    <circle r="112" fill="none" stroke="#D8D4D1" stroke-opacity=".46" stroke-width="2"/>
    <circle r="98" fill="none" stroke="#8B5CF6" stroke-opacity=".42" stroke-width="2"/>
    <circle r="80" fill="none" stroke="#D8D4D1" stroke-opacity=".14" stroke-width="1"/>
    <circle r="61" fill="#0C0C12" stroke="#6D3CFF" stroke-opacity=".34" stroke-width="1"/>

    <g stroke="#D8D4D1" stroke-width="2" opacity=".55">
      <path d="M0-124v20M0 104v20M-124 0h20M104 0h20"/>
      <path d="M-88-88l14 14M88-88L74-74M-88 88l14-14M88 88L74 74"/>
    </g>

    <g fill="#B57BFF">
      <circle cx="0" cy="-112" r="3"/>
      <circle cx="112" cy="0" r="3"/>
      <circle cx="0" cy="112" r="3"/>
      <circle cx="-112" cy="0" r="3"/>
    </g>

    <!-- anvil -->
    <g fill="none" stroke="url(#silver)" stroke-width="8" stroke-linejoin="round">
      <path d="M-58-34H59L46-17H18V3h-36v-20h-27z"/>
      <path d="M-17 3h34v44h21L27 64h-54L-38 47h21z"/>
    </g>

    <!-- energy spine -->
    <path d="M0-80v44M-8-48L0-36l8-12" fill="none" stroke="url(#violet)" stroke-width="4" filter="url(#softGlow)"/>
    <circle cx="0" cy="-81" r="4" fill="#B57BFF" filter="url(#softGlow)"/>

    <text x="0" y="-87" text-anchor="middle" fill="#D8D4D1" font-family="Georgia, serif" font-size="14" letter-spacing="5">KIRION</text>
    <text x="0" y="92" text-anchor="middle" fill="#A9A6B6" font-family="Georgia, serif" font-size="13" letter-spacing="4">FORGE</text>
  </g>

  <!-- title block -->
  <g>
    <text x="340" y="96" fill="#9D86CF" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="5">THE WORKING FLOOR OF KIRION</text>
    <text x="336" y="164" fill="url(#silver)" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="700" letter-spacing="1.5">THE KIRION SMITHY</text>
    <text x="340" y="207" fill="#D8D4D1" font-family="Arial, sans-serif" font-size="21">From idea to deployment — and deployment back into learning.</text>

    <path d="M340 236H1070" stroke="#4B4658" stroke-width="1"/>
    <path d="M340 236H655" stroke="url(#violet)" stroke-width="2.5" opacity=".8"/>

    <text x="340" y="274" fill="#98939F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="3.4">COGNITION · FORGE · BREAKOUT · KIRIONS</text>
  </g>
</svg>