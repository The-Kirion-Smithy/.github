<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
<title id="t">The Kirion Smithy</title>
<desc id="d">Ancient-engineering inspired Kirion Smithy banner.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#090b12"/>
    <stop offset=".48" stop-color="#141020"/>
    <stop offset="1" stop-color="#07080d"/>
  </linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6d3cff"/>
    <stop offset=".5" stop-color="#c084fc"/>
    <stop offset="1" stop-color="#7c3aed"/>
  </linearGradient>
  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36" fill="none" stroke="#a78bfa" stroke-opacity=".06"/>
  </pattern>
  <filter id="glow">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="1200" height="360" rx="26" fill="url(#bg)"/>
<rect width="1200" height="360" rx="26" fill="url(#grid)"/>

<!-- ancient technical seal -->
<g transform="translate(150 180)" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <circle r="104" stroke="#8b5cf6" stroke-opacity=".34" stroke-width="2"/>
  <circle r="88" stroke="#c4b5fd" stroke-opacity=".22" stroke-width="1"/>
  <circle r="70" stroke="#8b5cf6" stroke-opacity=".2" stroke-dasharray="4 10"/>
  <path d="M-116 0h24M92 0h24M0-116v24M0 92v24" stroke="#c084fc" stroke-width="3" filter="url(#glow)"/>
  <path d="M-55-34H54L40-17H19v23h-38v-23h-22z" stroke="#ececf5" stroke-width="7"/>
  <path d="M-17 6h34v48H40l-10 17h-60l-10-17h23z" stroke="#ececf5" stroke-width="7"/>
  <path d="M0-86v42M-9-55L0-44l9-11" stroke="url(#violet)" stroke-width="4" filter="url(#glow)"/>
  <circle cx="0" cy="-87" r="5" fill="#c084fc" stroke="none"/>
  <path d="M-81-82l13 13M81-82L68-69M-81 82l13-13M81 82L68 69" stroke="#8b5cf6" stroke-width="2"/>
  <circle cx="-74" cy="-74" r="4" fill="#8b5cf6" stroke="none"/>
  <circle cx="74" cy="-74" r="4" fill="#8b5cf6" stroke="none"/>
  <circle cx="-74" cy="74" r="4" fill="#8b5cf6" stroke="none"/>
  <circle cx="74" cy="74" r="4" fill="#8b5cf6" stroke="none"/>
</g>

<g font-family="Trebuchet MS, Arial, sans-serif">
  <text x="310" y="116" fill="#bda7ff" font-size="17" font-weight="700" letter-spacing="5">THE WORKING FLOOR OF KIRION</text>
  <text x="306" y="186" fill="#f4f1ff" font-size="58" font-weight="800" letter-spacing="2">THE KIRION SMITHY</text>
  <text x="310" y="231" fill="#c4b5fd" font-size="23" font-weight="600">From idea to deployment — and deployment back into learning.</text>
  <text x="310" y="277" fill="#a9a6b6" font-size="16" letter-spacing="2.8">UNDERSTAND · DESIGN · BUILD · VERIFY · DEPLOY · OPERATE · LEARN</text>
</g>

<path d="M310 307H1084" stroke="url(#violet)" stroke-width="3" opacity=".65"/>
<circle cx="1085" cy="307" r="5" fill="#c084fc"/>
</svg>